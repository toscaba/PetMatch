
name: PetMatch Java CI

# Automatischer Start bei Pushes auf allen Branches
# und bei Pull Requests auf main
on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Repository herunterladen
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Java 17 einrichten
      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: petmatch/pom.xml

      # Maven-Projekt bauen und Tests ausführen
      - name: Maven Build und Tests
        working-directory: ./petmatch
        run: mvn --batch-mode clean verify
